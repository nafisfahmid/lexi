name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PROJECT_DIR: project/LexiBangla

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q LexiBangla-Android-Project-v1.3.0.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Patch jvmTarget for newer Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i '/kotlinOptions *{/,/}/d' app/build.gradle.kts
          cat >> app/build.gradle.kts <<'EOF'

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          EOF

      - name: Create version pin script
        run: |
          cat > "$RUNNER_TEMP/pin.gradle" <<'EOF'
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { d ->
                      if (d.requested.group == 'androidx.core' && (d.requested.name == 'core' || d.requested.name == 'core-ktx')) {
                          d.useVersion('1.17.0')
                      }
                      }
                      if (d.requested.group.startsWith('androidx.compose') && d.requested.version == '1.12.1') {
                          d.useVersion('1.8.3')
                      }
                  }
              }
          }
          EOF

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -I "$RUNNER_TEMP/pin.gradle"

      - uses: actions/upload-artifact@v4
        with:
          name: lexi-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
