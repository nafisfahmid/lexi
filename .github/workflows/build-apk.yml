name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q LexiBangla-Android-Project-v1.3.0.zip -d project
          GRADLEW=$(find project -name gradlew | head -n 1)
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV 
          
      - name: Show build files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== libs.versions.toml ==="; cat gradle/libs.versions.toml || true
          echo "=== app/build.gradle.kts ==="; cat app/build.gradle.kts
          echo "=== build.gradle.kts ==="; cat build.gradle.kts || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Patch jvmTarget for newer Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i '/kotlinOptions *{/,/}/d' app/build.gradle.kts
          cat >> app/build.gradle.kts <<'EOF'

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          EOF
          tail -n 15 app/build.gradle.kts
          
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lexi-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
